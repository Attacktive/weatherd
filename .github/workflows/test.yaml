name: 'Test'
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
permissions:
  contents: 'read'
jobs:
  test:
    name: 'Test'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7'
      - name: 'Test provider evaluation tools'
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/provider_evaluation -p 'test_*.py'
      - name: 'Set up JDK'
        uses: 'actions/setup-java@v6'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: 'Start test and static analysis'
        run: 'bash scripts/ci/overlap-test-gate.sh start'
      - name: 'Enable KVM'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 'Instrumentation tests'
        uses: 'ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d' # v2.38.0
        with:
          api-level: 35
          target: 'google_apis'
          arch: 'x86_64'
          script: 'bash scripts/ci/overlap-test-gate.sh instrumentation'
