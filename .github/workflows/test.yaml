name: 'Test'
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
permissions:
  contents: 'read'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: 'Test'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7'
      - name: 'Test production release eligibility'
        run: |
          bash -n scripts/promote-production.sh scripts/play-release-state.sh
          bash scripts/play-release-state.test.sh
      - name: 'Test provider evaluation tools'
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/provider_evaluation -p 'test_*.py'
      - name: 'Test CI reporting tools'
        run: |
          venv="$RUNNER_TEMP/weatherd-ci-python"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/ci/requirements.txt
          printf '%s\n' "$venv/bin" >> "$GITHUB_PATH"
          "$venv/bin/python" -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: 'Start dependency/cache setup timing'
        run: 'python3 scripts/ci/ci_metrics.py mark setup-start'
      - name: 'Set up JDK'
        uses: 'actions/setup-java@v6'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: 'Start test and static analysis'
        run: |
          python3 scripts/ci/ci_metrics.py mark setup-end
          bash scripts/ci/overlap-test-gate.sh start
      - name: 'Enable KVM'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 'Start emulator provisioning timing'
        run: 'python3 scripts/ci/ci_metrics.py mark emulator-start'
      - name: 'Instrumentation tests'
        uses: 'ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d' # v2.38.0
        with:
          api-level: 35
          target: 'google_apis'
          arch: 'x86_64'
          script: 'bash scripts/ci/overlap-test-gate.sh instrumentation'
      - name: 'Publish CI timing and test summary'
        if: ${{ always() }}
        env:
          CI_CANCELLED: ${{ job.status == 'cancelled' }}
        run: 'bash scripts/ci/overlap-test-gate.sh report'
      - name: 'Retain CI test diagnostics'
        if: ${{ always() }}
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: test-diagnostics-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/weatherd-ci/
            build/reports/profile/
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/
            app/build/reports/tests/
            app/build/test-results/**/*.xml
