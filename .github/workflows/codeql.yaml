name: 'CodeQL'
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
jobs:
  analyze:
    name: 'Analyze'
    runs-on: 'ubuntu-latest'
    permissions:
      security-events: 'write'
      actions: 'read'
      contents: 'read'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7'
      - name: 'Set up JDK'
        uses: 'actions/setup-java@v6'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@v4.39.0'
        with:
          languages: 'java-kotlin'
          build-mode: 'manual'
      - name: 'Build'
        # CodeQL must observe compilation rather than restored task outputs.
        run: './gradlew --no-build-cache assembleDebug'
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@v4.39.0'
